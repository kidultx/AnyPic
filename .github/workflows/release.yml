name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platforms: darwin/universal
            artifact-dir: build/darwin-universal
            files: |
              AnyPic*.dmg
          - os: ubuntu-latest
            platforms: linux/amd64
            artifact-dir: build/linux-amd64
            files: |
              anypic_*.deb
              anypic-*.tar.gz
              install.sh
          - os: windows-latest
            platforms: windows/amd64
            artifact-dir: build/windows-amd64
            files: |
              *Setup*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Go checks
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            .github/scripts/macos-signing-setup.sh --allow-adhoc
          else
            .github/scripts/macos-signing-setup.sh
          fi

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bunx mygo build -platform darwin/universal

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: |
          if [ "${MACOS_SIGNING_MODE:-adhoc}" = "certificate" ]; then
            .github/scripts/macos-verify-release.sh \
              build/darwin-universal/AnyPic.app \
              build/darwin-universal/AnyPic*.dmg
          else
            echo "ad-hoc build (no signing secrets): skipping certificate verification"
          fi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bunx mygo build -platform linux/amd64

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: bunx mygo build -platform windows/amd64

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            cp ${{ matrix.artifact-dir }}/$pattern release/ 2>/dev/null || true
          done <<< "${{ matrix.files }}"
          ls -la release/

      - uses: actions/upload-artifact@v7
        with:
          name: AnyPic-${{ matrix.os }}
          path: release/*

      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: .github/scripts/macos-signing-cleanup.sh

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
