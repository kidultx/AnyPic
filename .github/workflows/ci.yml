name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Invariant 6: src/mygo.ts, src/locales.ts and locales/catalog_gen.go
      # are generated. A hand edit would otherwise pass every other check,
      # because the generated files are committed.
      - name: Generated files are up to date
        run: bun run generate && git diff --exit-code

      - name: Typecheck
        run: bun run typecheck

      - name: Outcome presentation tests
        run: bun run test

      - name: Go vet
        run: go vet ./...

      # -timeout is explicit because the default 10m per package is no longer
      # enough: the compression suite re-encodes multi-megapixel fixtures, and
      # under -race it runs ~10 minutes on a GitHub macOS runner. The old
      # default turned a slow run into a confusing "panic: test timed out".
      - name: Go test
        run: go test -race -count=1 -timeout 25m ./...

      - name: Build (sanity)
        run: bunx mygo build -platform darwin/amd64
