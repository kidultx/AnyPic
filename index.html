<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="" data-i18n-content="appDescription" />
    <title>AnyPic</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      try {
        const mode = localStorage.getItem("anypic-theme") || "system";
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (_) {}
    </script>
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="8.5" cy="8.5" r="1.4" /><path d="M21 15.5 16.5 11 5 21" /></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z" /><path d="m14.5 5.5 3 3" /></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.3-2h6l1.3 2h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-8Z" /><circle cx="12" cy="12.5" r="3.5" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" /><circle cx="12" cy="12" r="3" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l.9 13h9.2l.9-13M10 11v5M14 11v5" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 6.5" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7.5V13M12 16.5h.01" /></symbol>
      <symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9" /><path d="M3 12a9 9 0 0 1 9-9" opacity=".25" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.8 13.4A8.6 8.6 0 0 1 10.6 3.2 8.7 8.7 0 1 0 20.8 13.4Z" /></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12.5" rx="2" /><path d="M8.5 20.5h7M12 16.5v4" /></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" /></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" /><circle cx="4.5" cy="6" r=".8" /><circle cx="4.5" cy="12" r=".8" /><circle cx="4.5" cy="18" r=".8" /></symbol>
      <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M12 4v16" /><path d="m7 9 3 3-3 3M17 9l-3 3 3 3" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5" /><path d="M19.2 10A7.5 7.5 0 1 0 20 15" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" /><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5.5M12 7.5h.01" /></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16" /></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z" /><path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z" /></symbol>
    </svg>

    <div class="app">
      <header class="titlebar">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <img class="logo-light" src="./src/assets/logo-light.png" alt="" />
            <img class="logo-dark" src="./src/assets/logo-dark.png" alt="" />
          </span>
          <span class="wordmark">AnyPic</span>
        </div>

        <div class="titlebar-actions">
          <button class="secondary-btn small" id="screenshotBtn" type="button" data-i18n-title="screenshotTitle">
            <svg aria-hidden="true" class="icon"><use href="#i-camera" /></svg>
            <span data-i18n="screenshot"></span>
          </button>
          <button class="secondary-btn small" id="addBtn" type="button">
            <svg aria-hidden="true" class="icon"><use href="#i-add" /></svg>
            <span data-i18n="add"></span>
          </button>
          <span class="titlebar-sep" aria-hidden="true"></span>
          <button class="icon-btn" id="infoBtn" data-i18n-title="aboutAnyPic" data-i18n-aria="aboutAnyPic">
            <svg aria-hidden="true" class="icon"><use href="#i-info" /></svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <div class="sidebar-scroll">
            <section class="settings-block">
              <div class="block-head">
                <h2 data-i18n="compressionSettings"></h2>
                <button class="text-button" id="resetBtn" type="button" data-i18n-title="resetRecommendedTitle" data-i18n="reset"></button>
              </div>

              <div class="field quality-field">
                <div class="field-label">
                  <label data-i18n="quality"></label>
                  <span class="field-hint" id="qualityState" hidden></span>
                </div>
                <div class="segmented quality-presets" id="qualityPresets" role="group" data-i18n-aria="compressionQuality">
                  <button data-quality="60" aria-pressed="false" data-i18n="smaller"></button>
                  <button data-quality="82" class="active" aria-pressed="true" data-i18n="balanced"></button>
                  <button data-quality="95" aria-pressed="false" data-i18n="sharper"></button>
                </div>
              </div>

              <div class="field">
                <div class="field-label">
                  <label data-i18n="outputFormat"></label>
                  <span class="field-hint" id="formatHint"></span>
                </div>
                <div class="segmented" id="formatSeg" role="group" data-i18n-aria="outputFormat">
                  <button data-format="auto" class="active" aria-pressed="true" data-i18n="autoFormat"></button>
                  <button data-format="jpeg" aria-pressed="false">JPG</button>
                  <button data-format="png" aria-pressed="false">PNG</button>
                  <button data-format="webp" aria-pressed="false">WebP</button>
                </div>
              </div>

              <div class="tip-card" id="tipCard">
                <svg aria-hidden="true" class="icon tip-icon"><use href="#i-info" /></svg>
                <div>
                  <strong id="tipTitle"></strong>
                  <p id="tipText"></p>
                </div>
              </div>

              <label class="toggle-row auto-process-row">
                <span data-i18n="autoProcessLabel"></span>
                <input class="switch-input" id="autoProcessToggle" type="checkbox" checked />
                <span class="switch" aria-hidden="true"></span>
              </label>
              <p class="field-note" id="autoProcessNote"></p>
              <button class="text-button output-inline" id="outputInlineBtn" type="button">
                <span data-i18n="saveTo"></span> <span id="outputInlineLabel"></span> ›
              </button>
              <button class="text-button reset-location" id="resetLocation" type="button" hidden data-i18n="saveAlongside"></button>
            </section>

            <details class="more-settings" id="moreSettings">
              <summary class="more-settings-summary">
                <span data-i18n="moreSettings"></span>
                <svg aria-hidden="true" class="icon"><use href="#i-chevron" /></svg>
              </summary>
              <div class="more-settings-body">
                <section class="settings-block">
                  <div class="field quality-field">
                    <div class="field-label">
                      <label for="quality" data-i18n="qualityValueLabel"></label>
                      <span class="quality-readout"><b id="qualityValue">82</b><small>%</small></span>
                    </div>
                    <div class="range-wrap">
                      <input id="quality" type="range" min="30" max="100" step="1" value="82" />
                      <div class="range-track-fill" id="qualityFill"></div>
                    </div>
                    <div class="range-scale">
                      <span data-i18n="smaller"></span>
                      <span id="qualityLabel" class="quality-label"></span>
                      <span data-i18n="qualityBetter"></span>
                    </div>
                  </div>

                  <div class="field-row">
                    <label for="maxDim" data-i18n="maxDimension"></label>
                    <div class="select-wrap">
                      <select id="maxDim">
                        <option value="0" data-i18n="keepOriginalSize"></option>
                        <option value="3840">3840 px</option>
                        <option value="2560">2560 px</option>
                        <option value="1920">1920 px</option>
                        <option value="1280">1280 px</option>
                        <option value="800">800 px</option>
                      </select>
                      <svg aria-hidden="true" class="icon select-chevron"><use href="#i-chevron" /></svg>
                    </div>
                  </div>

                  <div class="field-row">
                    <label for="suffix" data-i18n="filenameSuffix"></label>
                    <input id="suffix" class="text-input" type="text" value="-anypic" maxlength="32" spellcheck="false" />
                  </div>
                </section>
              </div>
            </details>

            <div class="sidebar-prefs">
              <button class="text-button" id="prefsBtn" type="button" data-i18n="preferencesButton"></button>
              <kbd class="mod-key" data-shortcut="prefs">⌘,</kbd>
            </div>
          </div>

          <div class="side-edge" id="sideEdge" role="separator" aria-orientation="vertical" data-i18n-aria="resizeSidebar" tabindex="0"></div>
        </aside>

        <main class="stage">
          <header class="stage-head">
            <div class="stage-title">
              <div class="stage-title-row">
                <h1 data-i18n="images"></h1>
                <span class="count-badge" id="countBadge">0</span>
                <span class="stale-badge" id="staleBadge" role="status" hidden data-i18n="settingsChanged"></span>
                <p class="stage-summary" id="stats" hidden>
                  <span><span data-i18n="originalStatLabel"></span> <strong id="statOriginal">0 KB</strong></span>
                  <span class="summary-seg" id="summaryDone">
                    <svg aria-hidden="true" class="icon summary-arrow"><use href="#i-arrow-right" /></svg>
                    <span><span data-i18n="compressedStatLabel"></span> <strong id="statCompressed"></strong></span>
                  </span>
                  <span class="summary-seg" id="summarySaved">
                    <span class="summary-dot" aria-hidden="true"></span>
                    <span class="summary-saved"><span data-i18n="savedLabel"></span> <strong id="statSaved"></strong></span>
                    <span class="summary-foot" id="statSavedFoot"></span>
                  </span>
                  <span class="summary-pending" id="summaryPending" hidden></span>
                </p>
              </div>
            </div>
          </header>

          <div class="stage-body">
            <div class="empty-state" id="emptyState">
              <div class="empty-icon">
                <svg aria-hidden="true" class="icon"><use href="#i-image" /></svg>
              </div>
              <h2 id="emptyTitle"></h2>
              <p data-i18n="supportedFormats"></p>
              <div class="empty-actions">
                <button class="primary-btn compact" id="emptyAddBtn" type="button" data-i18n="chooseImages"></button>
                <span><span data-i18n="orPress"></span> <kbd class="mod-key" data-shortcut="open">⌘O</kbd></span>
              </div>
              <p class="empty-hint"><span data-i18n="pressPrefix"></span> <kbd class="mod-key" id="emptyShotKey"></kbd> <span data-i18n="captureSuffix"></span> <kbd class="mod-key" data-shortcut="paste">⌘V</kbd> <span data-i18n="toPasteImage"></span></p>
            </div>

            <div class="queue" id="queue" hidden>
              <div class="queue-toolbar">
                <div class="selection-bar" id="selectionBar" hidden>
                  <span id="selectionCount"></span>
                  <button class="text-button" id="removeSelectedBtn" type="button" data-i18n="removeSelected"></button>
                  <button class="text-button" id="clearSelectionBtn" type="button" data-i18n="clearSelection"></button>
                </div>
                <div class="queue-tabs" id="queueTabs" role="tablist" data-i18n-aria="filterImages">
                  <button class="queue-tab active" data-filter="all" role="tab" aria-selected="true" data-i18n="all"></button>
                  <button class="queue-tab" data-filter="done" role="tab" aria-selected="false" data-i18n="completed"></button>
                  <button class="queue-tab" data-filter="error" role="tab" aria-selected="false"><span data-i18n="failed"></span> <span id="tabErrorCount" hidden>0</span></button>
                </div>
                <div class="queue-tools">
                  <input id="queueFilter" class="queue-filter" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="filterByName" data-i18n-aria="filterByName" />
                  <button class="text-button" id="selectAllBtn" type="button"></button>
                  <div class="view-switch" id="viewSwitch" role="group" data-i18n-aria="view">
                    <button data-view="list" class="active" aria-pressed="true" data-i18n-title="listView" data-i18n-aria="listView"><svg aria-hidden="true" class="icon"><use href="#i-list" /></svg></button>
                    <button data-view="grid" aria-pressed="false" data-i18n-title="gridView" data-i18n-aria="gridView"><svg aria-hidden="true" class="icon"><use href="#i-grid" /></svg></button>
                  </div>
                  <span class="queue-divider" aria-hidden="true"></span>
                  <button class="icon-btn subtle" id="clearBtn" type="button" disabled data-i18n-title="clearList" data-i18n-aria="clearList">
                    <svg aria-hidden="true" class="icon"><use href="#i-trash" /></svg>
                  </button>
                </div>
              </div>
              <div class="queue-columns" id="queueColumns">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span data-i18n="nameColumn"></span>
                <span data-i18n="resultColumn"></span>
                <span></span>
              </div>
              <div class="queue-scroll" id="queueScroll">
                <div class="queue-list" id="queueList" role="listbox" aria-multiselectable="true" data-i18n-aria="imageQueue"></div>
                <div class="queue-empty-filter" id="queueEmptyFilter" hidden data-i18n="noFilterMatches"></div>
              </div>
            </div>
          </div>

          <footer class="stage-footer" id="stageFooter" hidden>
            <div class="batch-block">
              <span class="batch-status" id="batchStatus"></span>
              <div class="progress" role="progressbar" data-i18n-aria="compressionProgress">
                <span id="progressFill"></span>
              </div>
              <span class="batch-percent" id="batchPercent">0%</span>
              <button class="text-button footer-open" id="openSavedBtn" type="button" hidden data-i18n="openFolder"></button>
            </div>
            <div class="batch-actions">
              <button class="secondary-btn small" id="retryFailedBtn" type="button" hidden></button>
              <button class="secondary-btn small" id="cancelBtn" type="button" hidden data-i18n="cancel"></button>
              <button class="primary-btn compact" id="stageActionBtn" type="button">
                <svg aria-hidden="true" class="icon"><use href="#i-camera" id="stageActionIcon" /></svg>
                <span id="stageActionLabel"></span>
              </button>
            </div>
          </footer>
        </main>
      </div>
    </div>

    <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
      <div class="drop-overlay-inner">
        <div class="drop-overlay-icon"><svg aria-hidden="true" class="icon"><use href="#i-upload" /></svg></div>
        <h3 data-i18n="dropToAdd"></h3>
        <p data-i18n="dropHint"></p>
      </div>
    </div>

    <div class="modal" id="previewModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <article class="preview-card" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <header class="preview-head">
          <div class="preview-title">
            <div>
              <h3 id="previewTitle"></h3>
              <p id="previewMeta"></p>
            </div>
          </div>
          <div class="preview-head-actions">
            <div class="preview-nav" id="previewNav" role="group" data-i18n-aria="switchImage">
              <button class="icon-btn" id="previewPrev" type="button" data-i18n-aria="previousImage" data-i18n-title="previousImage"><svg aria-hidden="true" class="icon"><use href="#i-chevron" /></svg></button>
              <span class="preview-count" id="previewCount" aria-live="polite">1 / 1</span>
              <button class="icon-btn" id="previewNext" type="button" data-i18n-aria="nextImage" data-i18n-title="nextImage"><svg aria-hidden="true" class="icon"><use href="#i-chevron" /></svg></button>
            </div>
            <span class="queue-divider" aria-hidden="true"></span>
            <div class="preview-tabs" id="previewTabs" role="tablist" data-i18n-aria="previewMode">
              <button class="preview-tab active" data-mode="compare" role="tab" aria-selected="true" data-i18n="compare"></button>
              <button class="preview-tab" data-mode="beautify" role="tab" aria-selected="false" data-i18n="beautify"></button>
            </div>
            <span class="queue-divider" aria-hidden="true"></span>
            <button class="secondary-btn small" id="previewExportBtn" type="button">
              <svg aria-hidden="true" class="icon"><use href="#i-download" /></svg>
              <span data-i18n="exportLabel"></span>
            </button>
            <button class="icon-btn" id="previewClose" type="button" data-i18n-aria="close"><svg aria-hidden="true" class="icon"><use href="#i-x" /></svg></button>
          </div>
        </header>
        <div class="compare" id="compare">
          <div class="compare-loading" id="compareLoading"><span class="loader"></span><p data-i18n="generatingPreview"></p></div>
          <div class="compare-frame" id="compareFrame" hidden>
            <img class="compare-img compare-before" id="previewBefore" data-i18n-alt="originalWord" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" draggable="false" />
            <div class="compare-after-wrap" id="previewAfterWrap">
              <img class="compare-img compare-after" id="previewAfter" data-i18n-alt="compressedWord" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" draggable="false" />
            </div>
            <span class="compare-label label-before" data-i18n="originalWord"></span>
            <span class="compare-label label-after" data-i18n="compressedWord"></span>
            <div class="compare-handle" id="compareHandle">
              <span class="compare-line"></span>
              <span class="compare-knob"><svg aria-hidden="true" class="icon"><use href="#i-compare" /></svg></span>
            </div>
            <div class="compare-hint" id="compareHint" data-i18n="compareHint"></div>
            <div class="compare-zoom" id="compareZoom">
              <div class="segmented zoom-seg" id="zoomSeg" role="group" data-i18n-aria="zoom">
                <button type="button" id="zoomFit" data-zoom="fit" aria-pressed="true" data-i18n="fitToWindow"></button>
                <button type="button" id="zoom100" data-zoom="100" aria-pressed="false">100%</button>
              </div>
              <span class="zoom-readout" id="zoomReadout">100%</span>
            </div>
          </div>
        </div>
        <div class="beautify" id="beautify" hidden>
          <div class="beautify-stage">
            <div class="beautify-loading" id="beautifyLoading" hidden><span class="loader"></span></div>
            <img class="beautify-img" id="beautifyImg" data-i18n-alt="beautifyPreviewAlt" draggable="false" />
          </div>
          <aside class="beautify-controls">
            <div class="beautify-field">
              <span class="beautify-label" data-i18n="background"></span>
              <div class="segmented beautify-seg" id="beautifyBgKind" role="group" data-i18n-aria="backgroundType">
                <button data-kind="none" aria-pressed="false" data-i18n="backgroundNone"></button>
                <button data-kind="solid" aria-pressed="false" data-i18n="solid"></button>
                <button data-kind="gradient" aria-pressed="false" data-i18n="gradient"></button>
              </div>
              <div class="swatches" id="beautifySwatches" hidden></div>
              <div class="swatches gradients" id="beautifyGradients" hidden></div>
            </div>
            <div class="beautify-field">
              <span class="beautify-label" data-i18n="cornerRadius"></span>
              <div class="segmented beautify-seg" id="beautifyRadius" role="group" data-i18n-aria="cornerRadius">
                <button data-radius="none" aria-pressed="false" data-i18n="off"></button>
                <button data-radius="small" aria-pressed="false" data-i18n="small"></button>
                <button data-radius="medium" aria-pressed="false" data-i18n="medium"></button>
                <button data-radius="large" aria-pressed="false" data-i18n="large"></button>
              </div>
            </div>
            <div class="beautify-field-row">
              <div class="beautify-field">
                <span class="beautify-label" data-i18n="border"></span>
                <label class="toggle-row beautify-toggle">
                  <input class="switch-input" id="beautifyRing" type="checkbox" />
                  <span class="switch" aria-hidden="true"></span>
                </label>
              </div>
              <div class="beautify-field">
                <span class="beautify-label" data-i18n="shadow"></span>
                <div class="segmented beautify-seg" id="beautifyShadow" role="group" data-i18n-aria="shadow">
                  <button data-shadow="off" aria-pressed="false" data-i18n="off"></button>
                  <button data-shadow="soft" aria-pressed="false" data-i18n="soft"></button>
                  <button data-shadow="deep" aria-pressed="false" data-i18n="deep"></button>
                </div>
              </div>
            </div>
            <div class="beautify-field-row">
              <div class="beautify-field">
                <span class="beautify-label" data-i18n="padding"></span>
                <div class="segmented beautify-seg" id="beautifyPadding" role="group" data-i18n-aria="padding">
                  <button data-padding="compact" aria-pressed="false" data-i18n="compact"></button>
                  <button data-padding="normal" aria-pressed="false" data-i18n="normal"></button>
                  <button data-padding="roomy" aria-pressed="false" data-i18n="roomy"></button>
                </div>
              </div>
              <div class="beautify-field">
                <span class="beautify-label" data-i18n="canvasRatio"></span>
                <div class="segmented beautify-seg" id="beautifyRatio" role="group" data-i18n-aria="canvasRatio">
                  <button data-ratio="origin" aria-pressed="false" data-i18n="originalRatio"></button>
                  <button data-ratio="1:1" aria-pressed="false">1:1</button>
                  <button data-ratio="4:3" aria-pressed="false">4:3</button>
                  <button data-ratio="16:9" aria-pressed="false">16:9</button>
                </div>
              </div>
            </div>
            <div class="beautify-actions">
              <button class="secondary-btn" id="beautifyReset" type="button" data-i18n="reset"></button>
              <button class="primary-btn compact" id="beautifyApply" type="button">
                <svg aria-hidden="true" class="icon"><use href="#i-check" /></svg>
                <span data-i18n="apply"></span>
              </button>
            </div>
          </aside>
        </div>
        <footer class="preview-foot">
          <div class="preview-stats">
            <strong id="previewOriginalSize"></strong>
            <div class="preview-arrow"><svg aria-hidden="true" class="icon"><use href="#i-arrow-right" /></svg></div>
            <strong id="previewCompressedSize"></strong>
            <span class="preview-save" id="previewSaved"></span>
          </div>
          <div class="preview-details" id="previewDetails"></div>
        </footer>
      </article>
    </div>

    <div class="modal confirm-modal" id="confirmModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-confirm></div>
      <article class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="confirm-head">
          <span class="confirm-icon"><svg aria-hidden="true" class="icon"><use href="#i-alert" /></svg></span>
          <h3 id="confirmTitle"></h3>
        </div>
        <p id="confirmBody"></p>
        <div class="confirm-actions">
          <button class="secondary-btn" id="confirmCancel" type="button" data-i18n="cancel"></button>
          <button class="danger-btn" id="confirmOk" type="button"></button>
        </div>
      </article>
    </div>

    <div class="modal about-modal" id="aboutModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-about></div>
      <article class="about-card" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
        <div class="about-head">
          <div class="about-logo">
            <img class="logo-light" src="./src/assets/logo-light.png" alt="" />
            <img class="logo-dark" src="./src/assets/logo-dark.png" alt="" />
          </div>
          <div>
            <h3 id="aboutTitle">AnyPic</h3>
            <p class="about-version" id="aboutVersion">0.1.0</p>
          </div>
        </div>
        <p class="about-desc" data-i18n="aboutDescription"></p>
        <dl class="about-facts">
          <div><dt data-i18n="imageProcessing"></dt><dd data-i18n="onDevice"></dd></div>
          <div><dt data-i18n="supportedOutput"></dt><dd>JPG / PNG / WebP</dd></div>
          <div><dt data-i18n="desktopFramework"></dt><dd>MyGo + Go</dd></div>
        </dl>
        <div class="about-update">
          <p class="about-update-status" id="aboutUpdateStatus"></p>
          <div class="about-update-actions">
            <button class="secondary-btn small" id="updateCheckBtn" type="button" data-i18n="checkUpdate"></button>
            <button class="primary-btn compact" id="updateDownloadBtn" type="button" hidden>
              <svg aria-hidden="true" class="icon"><use href="#i-download" /></svg>
              <span id="updateDownloadLabel"></span>
            </button>
            <button class="secondary-btn small" id="updatePageBtn" type="button" hidden data-i18n="goToReleases"></button>
          </div>
        </div>
        <button class="secondary-btn" id="aboutClose" type="button" data-i18n="close"></button>
      </article>
    </div>


    <div class="modal prefs-modal" id="prefsModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-prefs></div>
      <article class="prefs-card" role="dialog" aria-modal="true" aria-labelledby="prefsTitle">
        <header class="prefs-head">
          <h3 id="prefsTitle" data-i18n="preferencesTitle"></h3>
          <button class="icon-btn" id="prefsClose" type="button" data-i18n-aria="close">
            <svg aria-hidden="true" class="icon"><use href="#i-x" /></svg>
          </button>
        </header>
        <div class="prefs-body">
          <section class="settings-block">
            <div class="block-head"><h2 data-i18n="appearance"></h2></div>
            <div class="field-row">
              <label data-i18n="language"></label>
              <div class="segmented prefs-language" id="languageSeg" role="group" data-i18n-aria="language">
                <button data-language="system" aria-pressed="false" data-i18n="followSystem"></button>
                <button data-language="zh-Hans" aria-pressed="false" data-i18n="languageChinese"></button>
                <button data-language="en" aria-pressed="false" data-i18n="languageEnglish"></button>
              </div>
            </div>
            <div class="field-row">
              <label data-i18n="theme"></label>
              <div class="segmented prefs-theme" id="themeSeg" role="group" data-i18n-aria="theme">
                <button data-theme="system" aria-pressed="false" data-i18n="followSystem"></button>
                <button data-theme="light" aria-pressed="false" data-i18n="light"></button>
                <button data-theme="dark" aria-pressed="false" data-i18n="dark"></button>
              </div>
            </div>
          </section>

          <section class="settings-block" id="windowSection">
            <div class="block-head"><h2 data-i18n="windowSection"></h2></div>
            <label class="toggle-row">
              <span data-i18n="launchAtLogin"></span>
              <input class="switch-input" id="openAtLoginToggle" type="checkbox" />
              <span class="switch" aria-hidden="true"></span>
            </label>
            <label class="toggle-row">
              <span data-i18n="hideDock"></span>
              <input class="switch-input" id="dockToggle" type="checkbox" checked />
              <span class="switch" aria-hidden="true"></span>
            </label>
          </section>

          <section class="settings-block">
            <div class="block-head"><h2 data-i18n="screenshotSection"></h2></div>
            <div class="shortcut-row">
              <label for="shortcutBtn" data-i18n="shortcut"></label>
              <button class="shortcut-input" id="shortcutBtn" type="button" data-i18n-title="shortcutButtonTitle">
                <span class="shortcut-value" id="shortcutValue">⌘⌥S</span>
                <svg aria-hidden="true" class="icon shortcut-edit" id="shortcutEdit"><use href="#i-pencil" /></svg>
              </button>
            </div>
            <p class="shortcut-hint" id="shortcutHint" hidden data-i18n="shortcutHint"></p>
            <label class="toggle-row">
              <span data-i18n="copyAfterCapture"></span>
              <input class="switch-input" id="clipboardToggle" type="checkbox" checked />
              <span class="switch" aria-hidden="true"></span>
            </label>
            <button class="text-button screen-permission" id="screenPermissionBtn" type="button" hidden data-i18n="checkScreenRecording"></button>
          </section>
        </div>
        <footer class="prefs-foot">
          <button class="secondary-btn" id="prefsDone" type="button" data-i18n="done"></button>
        </footer>
      </article>
    </div>

    <div class="context-menu" id="queueMenu" role="menu" data-i18n-aria="imageActions" hidden>
      <button type="button" role="menuitem" data-menu="preview"><svg aria-hidden="true" class="icon"><use href="#i-eye" /></svg><span data-i18n="comparePreview"></span></button>
      <button type="button" role="menuitem" data-menu="decorate"><svg aria-hidden="true" class="icon"><use href="#i-sparkle" /></svg><span data-i18n="beautifyWithCurrent"></span></button>
      <button type="button" role="menuitem" data-menu="export"><svg aria-hidden="true" class="icon"><use href="#i-download" /></svg><span data-i18n="exportLabel"></span></button>
      <span class="context-sep" role="separator"></span>
      <button type="button" role="menuitem" data-menu="reveal"><svg aria-hidden="true" class="icon"><use href="#i-folder" /></svg><span data-i18n="showInFolder"></span></button>
      <span class="context-sep" role="separator"></span>
      <button type="button" role="menuitem" data-menu="remove" class="danger"><svg aria-hidden="true" class="icon"><use href="#i-trash" /></svg><span id="queueMenuRemoveLabel"></span></button>
    </div>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
